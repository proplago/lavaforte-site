name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas de imagen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp
      - name: Descargar fotos de Higgsfield y pasarlas a webp
        run: sh descargar-fotos.sh
      - name: Generar páginas con fotos locales
        run: python3 build.py
      - name: Armar carpeta pública
        run: |
          mkdir -p _site
          cp -r *.html css js assets robots.txt llms.txt sitemap.xml _site/
          [ -f CNAME ] && cp CNAME _site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
